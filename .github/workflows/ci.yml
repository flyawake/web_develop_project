name: Node.js CI

on:
  push:
    branches: [ back_end ]
  pull_request:
    branches: [ back_end ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装依赖
        run: npm install

      - name: 代码检查
        run: npm run lint
        continue-on-error: true

      - name: 运行测试
        run: npm test

      - name: 生成构建
        run: npm run build
        if: ${{ always() && hashFiles('tsconfig.json') != '' }} 